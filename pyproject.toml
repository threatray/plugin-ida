[project]
name = "threatray-ida"
version = "3.0.5"
description = "Threatray IDA Plugin"
authors = [{name = "Threatray", email = "operations@threatray.com"}]
requires-python = ">=3.10"
dependencies = [
    # ida-plugin.json repeats these for the Hex-Rays plugin manager; a unit test keeps the two in sync
    "requests>=2.33",
    "keyring>=25",
]

[dependency-groups]
dev = [
    "coverage~=7.4",
    "PyHamcrest~=2.1",
    # the views are built outside IDA with the binding IDA 9.0 and 9.1 ship
    "pyqt5~=5.15",
    "pyqt5-sip~=12.16",
    "requests-mock~=1.12",
    "ruff~=0.8",
    "ty>=0.0.90",
    "types-requests~=2.31",
    "vulture~=2.11",
]

[tool.uv]
# the plugin is copied into IDA's plugins directory, it is never built or installed as a package
package = false
exclude-newer = "7 days"

[tool.ty.analysis]
# IDA's own modules only exist inside IDA
allowed-unresolved-imports = ["ida*", "idc", "threatray_ida.internal.**"]
# the same code runs on PyQt5 and PySide6, so the stubs of one binding would reject what the other needs
replace-imports-with-any = ["PyQt5.**", "PySide6.**", "shiboken6.**"]

[tool.ty.src]
exclude = ["vulture_whitelist.py"]

# the tests pass wrong types on purpose, edit recorded JSON in place and reach into private attributes
[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
no-matching-overload = "ignore"
not-subscriptable = "ignore"
unresolved-attribute = "ignore"

[tool.vulture]
paths = [".", "vulture_whitelist.py"]
exclude = [".venv/"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes (includes dead code detection)
    "I", # isort (import sorting)
    "PLC", # pylint convention
    "PLE", # pylint error
    "PLR", # pylint refactor
    "PLW", # pylint warning
    "RUF", # Ruff-specific rules (includes additional dead code checks)
]

ignore = [
    "PLR2004", # magic value comparison
    "RUF012", # mutable-class-default (Pydantic Config classes)
]

[tool.ruff.lint.per-file-ignores]
"vulture_whitelist.py" = ["ALL"]

[tool.ruff.lint.pylint]
max-args = 6
max-branches = 12
max-returns = 6
max-statements = 50
max-nested-blocks = 5
max-public-methods = 20
max-bool-expr = 5
max-locals = 21

[tool.ruff.lint.mccabe]
max-complexity = 10
