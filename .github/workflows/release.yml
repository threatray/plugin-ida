name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build release zip
        run: |
          mkdir release
          cp -r threatray_ida release/
          cp threatray_plugin.py release/
          cp requirements.txt release/
          cp CHANGELOG.md release/
          cp README.md release/
          cp LICENSE release/
          cp -r images release/
          cp ida-plugin.json release/ 2>/dev/null || true

          cd release
          zip -r ../threatray-ida-${{ github.ref_name }}.zip .

      - name: Attest build provenance
        if: github.repository_visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: threatray-ida-${{ github.ref_name }}.zip

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ github.ref_name }} \
            threatray-ida-${{ github.ref_name }}.zip \
            --title "${{ github.ref_name }}" \
            --generate-notes
